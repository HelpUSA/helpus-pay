name: HelpUS Pay CI (Sandbox Security & Unit Tests)

on:
  push:
    branches: [ master, 'feat/**' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm ci

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Run Sandbox PIX Service Tests
      run: npx tsx test/pix_service.test.mjs

    - name: Run G3-B loopback-only HTTP mock tests
      run: npx tsx test/g3b_http_pay.test.mjs


    - name: Enforce zero npm advisories in sandbox dependency tree
      run: npm audit --audit-level=moderate
