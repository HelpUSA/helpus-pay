name: HelpUS Pay CI (Sandbox Security & Unit Tests)

on:
  push:
    branches: [ master, feat/* ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm ci || npm install

    - name: Typecheck
      run: npx tsc --noEmit || true

    - name: Run Sandbox PIX Service Tests
      run: node test/pix_service.test.mjs
