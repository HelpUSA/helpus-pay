name: HelpUS Pay CI (Sandbox Security & Unit Tests)

on:
  push:
    branches: [ master, 'feat/**' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm ci

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Run Sandbox PIX Service Tests
      run: npx tsx test/pix_service.test.mjs

    - name: Run G3-B loopback-only HTTP mock tests
      run: npx tsx test/g3b_http_pay.test.mjs

    - name: Inspect npm dependency advisories (diagnostic only)
      run: |
        npm audit --json > /tmp/g3b-npm-audit.json || true
        node -e 'const fs=require("fs"); let a; try { a=JSON.parse(fs.readFileSync("/tmp/g3b-npm-audit.json","utf8")); } catch(e) { console.log("AUDIT_JSON_UNREADABLE", e.message); process.exit(0); } console.log("AUDIT_COUNTS", JSON.stringify(a.metadata?.vulnerabilities || {})); for(const [name, v] of Object.entries(a.vulnerabilities || {})) { console.log("AUDIT_FINDING", JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via?.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,range:x.range,url:x.url}),fixAvailable:v.fixAvailable})); }'
